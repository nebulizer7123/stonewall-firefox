<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stonewall Unlock</title>
  <link rel="stylesheet" href="../../styles/stonewall-theme.css">
</head>
<body class="unlock-page">
  <main class="unlock-shell">
    <section class="settings-card unlock-card">
      <h1 id="unlockTitle">Scan Your Unlock Code</h1>
      <p id="unlockHint" class="form-note">
        Hold your printed QR code up to the camera.
      </p>
      <div class="scan-frame">
        <video id="preview" autoplay muted playsinline></video>
      </div>
      <div id="unlockStatus" class="form-note" aria-live="polite"></div>
      <div class="buttonRow">
        <button id="cancelBtn" type="button">Cancel</button>
        <button id="doneBtn" type="button" style="display:none;">Open Preferences</button>
      </div>
    </section>
  </main>
  <script src="../../styles/theme.js"></script>
  <script src="../../libs/jsQR.js"></script>
  <script src="unlock.js"></script>
</body>
</html>
